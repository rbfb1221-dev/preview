name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      # без -v: логи публичного репозитория не должны показывать имена файлов
      - run: |
          mkdir out
          cat site.* | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SITE_KEY | tar -xf - -C out
          mkdir out/okno-v-poryadke
          cp okno-v-poryadke/index.html out/okno-v-poryadke/index.html
          mkdir -p out/okno-v-poryadke/zelenograd
          for file in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            install -m 644 "okno-v-poryadke/zelenograd/$file" "out/okno-v-poryadke/zelenograd/$file"
          done
          install -D -m 644 okno-v-poryadke/app/index.html out/okno-v-poryadke/app/index.html
          install -D -m 644 service-demos/index.html out/service-demos/index.html
          install -m 644 service-demos/clean-furniture.png out/service-demos/clean-furniture.png
          chmod -R a+rX out
          tar -cf artifact.tar -C out .
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          for attempt in {1..16}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id' | grep -Fxq "$PAGES_ARTIFACT_ID"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - uses: actions/deploy-pages@v4
      # артефакт публичного репозитория может скачать кто угодно — после выкладки удаляем
      - if: always()
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.upload.outputs.artifact-id }}"
        env:
          GH_TOKEN: ${{ github.token }}
