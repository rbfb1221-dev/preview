<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо заявок для выездных услуг</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #21251f; background: #f6f5ef; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button, a { touch-action: manipulation; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #2d64c0; outline-offset: 3px; }
    .wrap { margin: auto; width: min(1080px, calc(100% - 36px)); }
    header { border-bottom: 1px solid #dcded4; }
    header .wrap { min-height: 67px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header strong { font-size: 1rem; }
    header a { font-size: .9rem; text-underline-offset: 4px; }
    main { padding: clamp(32px, 7vw, 80px) 0 56px; }
    h1, h2, p { margin: 0; }
    h1 { max-width: 17ch; font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.04; letter-spacing: -.065em; text-wrap: balance; }
    h2 { font-size: 1.45rem; line-height: 1.2; letter-spacing: -.035em; }
    p { color: #51584d; }
    .layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(24px, 6vw, 72px); align-items: start; }
    .intro p { margin-top: 20px; max-width: 37ch; font-size: 1.08rem; }
    .preview { margin-top: 30px; padding: 22px; background: var(--wash, #e8eddf); border-radius: 18px; }
    .preview p { font-size: .875rem; margin: 4px 0 14px; }
    .message { background: white; border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .94rem; }
    .message img { display: block; max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 12px; }
    .card { background: #fff; padding: clamp(18px, 4vw, 32px); border: 1px solid #dedfd6; border-radius: 22px; box-shadow: 0 12px 34px #29251b0a; }
    .card > p { margin: 5px 0 18px; font-size: .9rem; }
    #fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; align-content: start; gap: 5px; min-width: 0; font-size: .92rem; font-weight: 650; }
    .wide { grid-column: 1 / -1; }
    input, select { width: 100%; min-height: 43px; min-width: 0; border: 1px solid #cfd2c8; border-radius: 9px; padding: 8px 10px; background: #fff; color: inherit; }
    input[type=file] { padding: 8px; }
    input::file-selector-button { border: 0; border-radius: 5px; padding: 5px 8px; margin-right: 7px; background: var(--wash, #e8eddf); color: #252923; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    button { cursor: pointer; border: 1px solid transparent; border-radius: 10px; padding: 10px 14px; font-weight: 650; }
    .primary { background: var(--ink, #254e38); color: #fff; }
    .secondary { background: #fff; border-color: #cfd2c8; color: inherit; }
    #status { margin-top: 12px; font-size: .875rem; }
    #status:empty { display: none; }
    .directory { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 24px; }
    .directory a { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; font-weight: 650; min-height: 82px; }
    .directory a:hover { background: #edf1e8; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .card { grid-row: 2; }
      .preview { grid-row: 3; margin: 0; }
    }
    @media (min-width: 761px) {
      .card { grid-column: 2; grid-row: 1 / span 2; }
      .preview { grid-column: 1; margin: -34px 0 0; }
    }
    @media (max-width: 390px) { #fields { grid-template-columns: 1fr; } }

    .tailored { font-family: "Segoe UI", Arial, sans-serif; background: var(--paper); color: #242a2b; }
    .tailored .wrap { width: min(1260px, calc(100% - 72px)); }
    .tailored header, .service-hero { background: var(--night); color: #faf2e6; }
    .tailored header { border-bottom: 0; }
    .tailored header .wrap { min-height: 78px; }
    .tailored header strong { font-weight: 750; letter-spacing: -.025em; font-size: 1.13rem; }
    .service-hero { padding: 15px 0 clamp(25px, 4vw, 52px); }
    .hero-inner { display: grid; grid-template-columns: .93fr 1.07fr; align-items: stretch; min-height: clamp(400px, 41vw, 565px); border-top: 1px solid #ffffff38; }
    .hero-copy { padding: clamp(30px, 6vw, 82px) clamp(18px, 4.5vw, 64px) clamp(26px, 5vw, 70px) 0; align-self: center; }
    .hero-label { color: var(--accent); font-size: .9rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 19px; }
    .hero-copy h1 { max-width: none; font-size: clamp(3rem, 6vw, 6.1rem); line-height: .97; letter-spacing: -.075em; font-weight: 740; }
    .hero-copy h1 span { display: block; color: var(--accent); }
    .hero-copy .lede { margin: 22px 0; max-width: 33ch; color: #f3e9dd; font-size: clamp(1rem, 1.6vw, 1.2rem); line-height: 1.55; }
    .hero-cta { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 10px 19px; border-radius: 8px; background: var(--accent); color: #21251f; text-decoration: none; font-weight: 740; }
    .hero-photo { position: relative; margin: 0; overflow: hidden; border-radius: 0 0 17px 17px; background: var(--wash); }
    .hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--position, center); }
    .tailored main { padding-block: clamp(34px, 6vw, 72px); }
    .tailored .layout { grid-template-columns: 1.13fr .87fr; gap: clamp(16px, 3vw, 30px); }
    .tailored .intro { grid-column: 1 / -1; }
    .tailored .intro h1, .tailored .intro h2 { max-width: none; font-size: clamp(2.2rem, 4.9vw, 4.8rem); line-height: .99; letter-spacing: -.067em; }
    .tailored .intro p { margin-top: 12px; max-width: 56ch; }
    .tailored .card { grid-area: 2 / 1; padding: clamp(18px, 3.3vw, 42px); background: #fffdf9; border-color: var(--line); border-radius: 20px; }
    .tailored .preview { grid-area: 2 / 2; margin: 0; padding: clamp(18px, 3.3vw, 32px); border-radius: 20px; }
    .tailored input, .tailored select, .tailored .secondary { min-height: 47px; border-color: var(--line); }
    .tailored button { min-height: 48px; border-radius: 8px; }
    @media (max-width: 760px) {
      .tailored .wrap { width: calc(100% - 36px); }
      .tailored header .wrap { min-height: 63px; }
      .hero-inner { grid-template-columns: 1fr; min-height: 0; }
      .hero-copy { padding: 25px 0 20px; }
      .hero-copy h1 { font-size: clamp(2.65rem, 10vw, 4.7rem); }
      .hero-label { margin-bottom: 12px; }
      .hero-copy .lede { margin-block: 16px; }
      .hero-photo { min-height: clamp(170px, 53vw, 320px); border-radius: 10px; }
      .tailored .layout { grid-template-columns: 1fr; }
      .tailored .card { grid-area: 2 / 1; }
      .tailored .preview { grid-area: 3 / 1; }
    }
  </style>
</head>
<body>
  <header><div class="wrap"><strong id="brand">Демо заявок</strong><a id="all" href="./" hidden>Все демо</a></div></header>
  <section class="service-hero" id="service-hero" aria-labelledby="hero-title" hidden>
    <div class="hero-inner wrap">
      <div class="hero-copy">
        <p class="hero-label" id="hero-label"></p>
        <h1 id="hero-title"><span id="hero-title-accent"></span></h1>
        <p class="lede" id="hero-description"></p>
        <a class="hero-cta" href="#quote">Узнать стоимость</a>
      </div>
      <figure class="hero-photo"><img id="hero-image" width="1200" height="800" fetchpriority="high" alt=""></figure>
    </div>
  </section>
  <main class="wrap" id="quote">
    <section id="directory-page" hidden>
      <h1>Демо для выездных услуг</h1>
      <div class="directory" id="directory"></div>
    </section>
    <div class="layout" id="service" hidden>
      <section class="intro">
        <h1 id="title"></h1><h2 id="quote-title" hidden></h2>
        <p id="description"></p>
      </section>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Данные для оценки</h2>
        <p>Демо-форма. Данные остаются на этой странице.</p>
        <form id="form">
          <div id="fields"></div>
          <div class="actions">
            <button class="primary" type="submit">Показать заявку мастеру</button>
            <button class="secondary" id="example" type="button">Подставить пример</button>
          </div>
          <p id="status" role="status"></p>
        </form>
      </section>
      <section class="preview" id="preview" aria-labelledby="preview-title">
        <h2 id="preview-title" tabindex="-1">Пример сообщения в Telegram</h2>
        <p>Так мастер увидит данные заявки.</p>
        <div class="message"><span id="message"></span><img id="photo-preview" alt="Фото из примера заявки" hidden></div>
      </section>
    </div>
    <noscript>Включите JavaScript, чтобы открыть демо.</noscript>
  </main>
  <script>
    const fields = {
      text: (label, example, placeholder = '', wide = false) => ({ label, example, placeholder, wide }),
      select: (label, options, example = options[0]) => ({ label, options, example }),
      photo: label => ({ label, type: 'file', wide: true, optional: true }),
      phone: { label: 'Телефон для связи', type: 'tel', example: '+7 900 000-00-00', placeholder: '+7 900 000-00-00' }
    };
    const { text, select, photo, phone } = fields;
    const presets = {
      removal: {
        name: 'Вывоз вещей и мебели', title: 'Рассчитайте вывоз по фото', colors: ['#214f3e', '#e4efe5'],
        description: 'Укажите, что нужно вывезти. По фото, этажу и наличию лифта исполнитель сможет оценить стоимость.',
        fields: [text('Что вывезти', 'Диван и кресло', 'Например, диван и кресло', true),
          text('Адрес или район', 'Советский район', 'Район или улица'), text('Этаж', '5', 'Например, 5'),
          select('Лифт', ['Нет лифта', 'Пассажирский', 'Грузовой']), phone, photo('Фото вещей')]
      },
      upholstery: {
        name: 'Перетяжка мебели', title: 'Узнайте цену перетяжки', colors: ['#723d34', '#f3e8e3'],
        description: 'Опишите мебель и приложите фото. Мастер оценит работу и подскажет, какие детали нужно уточнить.',
        fields: [select('Тип мебели', ['Угловой диван', 'Прямой диван', 'Кресло', 'Стулья', 'Другое']),
          text('Примерные размеры', '240 × 160 см', 'Можно написать «не знаю»'),
          text('Что нужно заменить', 'Обивку, каркас цел', 'Обивка, наполнитель или ремонт', true),
          { ...text('Ткань или цвет', 'Серо-зелёный велюр', 'Если уже выбрали'), optional: true }, phone, photo('Фото мебели')]
      },
      moving: {
        name: 'Переезды и грузчики', title: 'Получите оценку переезда', colors: ['#304d7b', '#e5ecf7'],
        description: 'Укажите маршрут, крупные вещи и условия погрузки. Исполнитель сможет предложить машину и оценить работу.',
        fields: [text('Откуда', 'Центральный район', 'Район отправления'),
          text('Куда', 'Заречье', 'Район назначения'),
          text('Этаж и лифт при погрузке', '4-й, без лифта', 'Например, 4-й, без лифта'),
          text('Этаж и лифт при выгрузке', '7-й, грузовой лифт', 'Например, 7-й, грузовой лифт'),
          text('Крупные вещи', 'Холодильник и 8 коробок', 'Мебель, техника, коробки', true),
          text('Когда нужен переезд', 'В субботу после 12:00', 'День и время'), phone]
      },
      screens: {
        name: 'Москитные сетки', title: 'Рассчитайте москитные сетки', colors: ['#3d5840', '#e9eee0'],
        description: 'Укажите тип проёма, количество и размеры. Если размеров нет, мастер подскажет, как организовать замер.',
        fields: [select('Тип проёма', ['Окно', 'Балконная дверь', 'Другой проём']),
          text('Количество', '2', 'Например, 2'),
          text('Примерные размеры', '60 × 130 см', 'Можно написать «нужен замер»'),
          phone, photo('Фото проёма или крепления')]
      },
      cleaning: {
        name: 'Химчистка мебели', title: 'Узнайте цену химчистки по фото', colors: ['#325369', '#e1eef1'],
        description: 'Опишите мебель и загрязнение. По фото мастер сможет уточнить стоимость чистки и согласовать выезд.',
        fields: [select('Тип мебели', ['Прямой диван', 'Угловой диван', 'Кресло', 'Матрас', 'Другое']),
          text('Размер или число мест', '3 места', 'Например, 3 места'),
          text('Что нужно почистить', 'Пятно от кофе на сиденье', 'Расскажите о пятнах или запахе', true),
          text('Район', 'Центральный', 'Район или улица'), phone, photo('Фото мебели и загрязнения')]
      }
    };

    const landing = {
      removal: {
        label: 'Вывоз мебели', headline: 'Старую мебель', accent: 'пора вывезти.',
        description: 'Покажите, что нужно забрать, и укажите этаж и лифт. Исполнитель оценит объём и скажет, сколько будет стоить вывоз.',
        photo: 4246098, alt: 'Диван и коробки с вещами в комнате', position: 'center 50%',
        palette: ['#25352c', '#d6e49e', '#f3f2e8', '#d7dbcb']
      },
      upholstery: {
        label: 'Перетяжка мебели', headline: 'Обновите', accent: 'любимый диван.',
        description: 'Приложите фото мебели, укажите размеры и расскажите, что хочется поменять. Мастер даст предварительную оценку.',
        photo: 4846097, alt: 'Мягкий диван с декоративными подушками', position: 'center 55%',
        palette: ['#3e2d2b', '#ffc19f', '#f7f0e9', '#dfd2c8']
      },
      cleaning: {
        label: 'Выездная химчистка', headline: 'Диван снова', accent: 'будет чистым.',
        description: 'Покажите диван и пятна на фото. Мастер уточнит цену чистки и предложит время выезда.',
        photo: 27176672, alt: 'Чистка обивки дивана пылесосом', position: 'center 50%',
        palette: ['#223846', '#aee3e7', '#eef4f4', '#d0dbde']
      }
    };

    const byId = id => document.getElementById(id);
    const selected = new URLSearchParams(location.search).get('service');
    if (Object.hasOwn(presets, selected)) {
      showService(presets[selected], landing[selected]);
    } else {
      byId('directory-page').hidden = false;
      for (const [id, preset] of Object.entries(presets)) {
        const link = document.createElement('a');
        link.className = 'card';
        link.href = '?service=' + id;
        link.textContent = preset.name;
        byId('directory').append(link);
      }
    }

  function normalizePhone(value) {
    if (typeof value !== "string" || value.length > 24 || !/^\+?[\d ()-]+$/.test(value)) return null;
    const digits = value.replace(/\D/g, "");
    if (value.startsWith("+")) return /^7\d{10}$/.test(digits) ? `+${digits}` : null;
    if (digits.length === 10) return `+7${digits}`;
    if (digits.length === 11 && /^[78]/.test(digits)) return `+7${digits.slice(1)}`;
    return null;
  }

    function preparePhone(input) {
      input.value = '+7';
      input.addEventListener('input', () => {
        const raw = input.value.trimStart();
        const digits = raw.replace(/\D/g, '');
        const explicit = raw.startsWith('+7');
        const prefix = explicit || (digits.length > 10 && /^[78]/.test(digits));
        const cursor = input.selectionStart ?? raw.length;
        const before = raw.slice(0, cursor).replace(/\D/g, '').length;
        const national = digits.slice(Number(prefix), Number(prefix) + 10);
        input.value = '+7' + national;
        const position = 2 + Math.max(0, Math.min(national.length, before - Number(prefix)));
        input.setSelectionRange(position, position);
        input.setCustomValidity('');
      });
    }

    function showService(preset, details) {
      if (details) {
        const [night, accent, paper, line] = details.palette;
        const style = document.documentElement.style;
        for (const [key, value] of Object.entries({night, accent, paper, line, position: details.position})) {
          style.setProperty('--' + key, value);
        }
        document.body.classList.add('tailored');
        byId('hero-label').textContent = details.label;
        byId('hero-title-accent').before(document.createTextNode(details.headline));
        byId('hero-title-accent').textContent = details.accent;
        byId('hero-description').textContent = details.description;
        const image = byId('hero-image');
        image.alt = details.alt;
        image.src = 'https://images.pexels.com/photos/' + details.photo + '/pexels-photo-' + details.photo + '.jpeg?auto=compress&cs=tinysrgb&w=1280';
        byId('service-hero').hidden = false;
        byId('title').hidden = true;
        byId('quote-title').textContent = preset.title;
        byId('quote-title').hidden = false;
      }
      document.title = preset.name + ' — демо заявки';
      document.documentElement.style.setProperty('--ink', preset.colors[0]);
      document.documentElement.style.setProperty('--wash', preset.colors[1]);
      byId('brand').textContent = preset.name;
      byId('title').textContent = preset.title;
      byId('description').textContent = preset.description;
      byId('all').hidden = false;
      byId('service').hidden = false;

      const controls = preset.fields.map(field => {
        const label = document.createElement('label');
        label.classList.toggle('wide', Boolean(field.wide));
        const caption = document.createElement('span');
        caption.textContent = field.label + (field.optional ? ' (необязательно)' : '');
        const control = document.createElement(field.options ? 'select' : 'input');
        if (field.options) {
          control.add(new Option('Выберите вариант', ''));
          for (const option of field.options) control.add(new Option(option, option));
        } else {
          control.type = field.type || 'text';
          control.placeholder = field.placeholder || '';
          if (field.type === 'file') control.accept = 'image/*';
          else control.maxLength = 200;
          if (field.type === 'tel') {
            control.inputMode = 'tel';
            control.autocomplete = 'off';
            if (details) preparePhone(control);
          }
        }
        control.required = !field.optional;
        label.append(caption, control);
        byId('fields').append(label);
        return { field, control };
      });

      const photoPreview = byId('photo-preview');
      let photoUrl;
      function renderMessage(useExample) {
        const lines = ['Новая заявка · ' + preset.name, ''];
        let attachedPhoto;
        for (const { field, control } of controls) {
          if (field.type === 'file') {
            const file = control.files?.[0];
            if (!useExample && file?.type.startsWith('image/')) attachedPhoto = file;
          } else {
            const value = useExample ? field.example : control.value.trim();
            if (value) lines.push(field.label + ': ' + value);
          }
        }
        if (attachedPhoto) lines.push('Фото: ' + attachedPhoto.name);
        byId('message').textContent = lines.join('\n');
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = attachedPhoto ? URL.createObjectURL(attachedPhoto) : undefined;
        if (photoUrl) photoPreview.src = photoUrl;
        else photoPreview.removeAttribute('src');
        photoPreview.hidden = !photoUrl;
      }
      renderMessage(true);

      byId('example').addEventListener('click', () => {
        for (const { field, control } of controls) {
          control.value = field.example || '';
          if (field.type === 'tel' && details) control.setCustomValidity('');
        }
        renderMessage(true);
        byId('status').textContent = 'Пример подставлен. Поля можно изменить.';
      });
      byId('form').addEventListener('submit', event => {
        event.preventDefault();
        for (const { field, control } of controls) {
          if (field.type === 'tel' && details && !normalizePhone(control.value)) {
            control.setCustomValidity('Введите 10 цифр после +7.');
            control.reportValidity();
            return;
          }
          if (!field.optional && !control.value.trim()) {
            control.value = '';
            control.reportValidity();
            return;
          }
        }
        renderMessage(false);
        byId('status').textContent = 'Пример заявки обновлён.';
        byId('preview-title').focus();
      });
    }
  </script>
</body>
</html>
