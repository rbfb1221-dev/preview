<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо заявок для выездных услуг</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #21251f; background: #f6f5ef; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button, a { touch-action: manipulation; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #2d64c0; outline-offset: 3px; }
    .wrap { margin: auto; width: min(1080px, calc(100% - 36px)); }
    header { border-bottom: 1px solid #dcded4; }
    header .wrap { min-height: 67px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header strong { font-size: 1rem; }
    header a { font-size: .9rem; text-underline-offset: 4px; }
    main { padding: clamp(32px, 7vw, 80px) 0 56px; }
    h1, h2, p { margin: 0; }
    h1 { max-width: 17ch; font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.04; letter-spacing: -.065em; text-wrap: balance; }
    h2 { font-size: 1.45rem; line-height: 1.2; letter-spacing: -.035em; }
    p { color: #51584d; }
    .layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(24px, 6vw, 72px); align-items: start; }
    .intro p { margin-top: 20px; max-width: 37ch; font-size: 1.08rem; }
    .preview { margin-top: 30px; padding: 22px; background: var(--wash, #e8eddf); border-radius: 18px; }
    .preview p { font-size: .875rem; margin: 4px 0 14px; }
    .message { background: white; border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .94rem; }
    .message img { display: block; max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 12px; }
    .card { background: #fff; padding: clamp(18px, 4vw, 32px); border: 1px solid #dedfd6; border-radius: 22px; box-shadow: 0 12px 34px #29251b0a; }
    .card > p { margin: 5px 0 18px; font-size: .9rem; }
    #fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; align-content: start; gap: 5px; min-width: 0; font-size: .92rem; font-weight: 650; }
    .wide { grid-column: 1 / -1; }
    input, select { width: 100%; min-height: 43px; min-width: 0; border: 1px solid #cfd2c8; border-radius: 9px; padding: 8px 10px; background: #fff; color: inherit; }
    input[type=file] { padding: 8px; }
    input::file-selector-button { border: 0; border-radius: 5px; padding: 5px 8px; margin-right: 7px; background: var(--wash, #e8eddf); color: #252923; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    button { cursor: pointer; border: 1px solid transparent; border-radius: 10px; padding: 10px 14px; font-weight: 650; }
    .primary { background: var(--ink, #254e38); color: #fff; }
    .secondary { background: #fff; border-color: #cfd2c8; color: inherit; }
    #status { margin-top: 12px; font-size: .875rem; }
    #status:empty { display: none; }
    .directory { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 24px; }
    .directory a { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; font-weight: 650; min-height: 82px; }
    .directory a:hover { background: #edf1e8; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .card { grid-row: 2; }
      .preview { grid-row: 3; margin: 0; }
    }
    @media (min-width: 761px) {
      .card { grid-column: 2; grid-row: 1 / span 2; }
      .preview { grid-column: 1; margin: -34px 0 0; }
    }
    @media (max-width: 390px) { #fields { grid-template-columns: 1fr; } }


    .service-app {
      --background: #f4f6f5; --surface: #fff; --ink: #172624; --muted: #425653; --line: #c7d2ce;
      --accent: #14644e; --tint: #e7f3ed; --hero: #142d27; --on-hero: #fff;
      background: var(--background); color: var(--ink); min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.45;
    }
    .service-app :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .service-app .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .appwrap { width: min(1120px, calc(100% - 44px)); margin-inline: auto; }
    .apptop { background: var(--surface); border-bottom: 1px solid var(--line); }
    .appbar { min-height: 65px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .appbrand { display: flex; align-items: center; gap: 10px; font-size: .95rem; }
    .appmark { width: 26px; height: 26px; border-radius: 8px; flex: 0 0 26px; background: var(--accent); position: relative; }
    .appmark::before { content: ""; position: absolute; inset: 7px; border: 2px solid #fff; border-radius: 3px; }
    .appdemo { color: var(--muted); font-size: .82rem; font-weight: 670; }
    .appnav { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    .appnav button { background: transparent; color: var(--ink); border: 0; border-radius: 8px; padding: 7px 16px; min-height: 36px; box-shadow: none; }
    .appnav button[aria-current] { background: var(--tint); color: var(--accent); }
    .appnav button:disabled { color: #566861; cursor: default; }
    .appmain { padding-block: 22px 48px; }
    .apphero { position: relative; isolation: isolate; overflow: hidden; background: var(--hero); color: var(--on-hero); border-radius: 22px; min-height: 272px; display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; }
    .apphero img { width: 100%; height: 100%; min-height: 0; position: absolute; inset: 0 0 0 auto; width: 58%; z-index: -2; object-fit: cover; object-position: var(--photo-position); }
    .apphero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, var(--hero) 38%, transparent 76%); }
    .herocopy { padding: clamp(22px,5vw,48px); align-self: center; }
    .apphero h1 { max-width: 13ch; font-size: clamp(2.15rem,4.7vw,4.35rem); letter-spacing: -.067em; line-height: .99; color: var(--on-hero); }
    .apphero p { margin-top: 14px; color: #f1f6f4; max-width: 39ch; font-size: .98rem; }
    .appgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); align-items: start; gap: 16px; }
    .apphero + .appgrid { margin-top: 16px; }
    .appcard, .appsummary { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: clamp(16px,3vw,25px); min-width: 0; }
    .appcard h2, .appsummary h2 { color: var(--ink); margin-bottom: 15px; font-weight: 720; font-size: 1.55rem; letter-spacing: -.04em; line-height: 1.12; }
    .appsummary h2 { font-size: 1.15rem; }
    .appsummary p { color: var(--muted); margin-top: 8px; font-size: .92rem; }
    .appsummary .app-selection { font-weight: 700; color: var(--ink); }
    .appsummary .appprivacy { padding-top: 10px; border-top: 1px solid var(--line); font-size: .82rem; }
    .appcard fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    .appchoices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .appchoice { display: grid; grid-template-columns: 20px minmax(0,1fr); align-items: start; gap: 10px; cursor: pointer; padding: 12px; min-height: 72px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); }
    .appchoice input { width: 17px; height: 17px; min-height: 0; margin: 3px 0 0; accent-color: var(--accent); }
    .appchoice strong, .appchoice small { display: block; }
    .appchoice small { color: var(--muted); margin-top: 2px; font-size: .82rem; font-weight: 450; }
    .appchoice:hover, .appchoice:has(input:checked) { background: var(--tint); border-color: var(--accent); }
    .appfields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .applabel { display: grid; gap: 6px; margin: 0; color: var(--ink); }
    .applabel.wide { grid-column: 1 / -1; }
    .appfields input, .appfields select, .apptelephone input { color: var(--ink); background: var(--surface); min-height: 46px; }
    .appfields input::placeholder, .apptelephone input::placeholder { color: #576760; opacity: 1; }
    .appupload { margin-block: 14px; }
    .appupload label { display: block; cursor: pointer; padding: 11px 13px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--tint); color: var(--ink); }
    .appupload label small { display: block; color: var(--muted); font-weight: 450; overflow-wrap: anywhere; }
    .appupload:has(input:focus-visible) label { outline: 3px solid var(--accent); outline-offset: 3px; }
    .appattachment { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .appattachment img { display: block; width: 72px; height: 52px; border-radius: 7px; object-fit: cover; }
    .apperror { color: #a12427; margin-top: 6px; font-size: .9rem; }
    .apptelephone { display: flex; align-items: center; margin-top: 6px; width: min(100%, 340px); border: 1px solid #a8b8b3; border-radius: 9px; background: var(--surface); }
    .apptelephone:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
    .apptelephone span { padding-left: 13px; color: #576760; }
    .apptelephone.has-number span { color: var(--ink); }
    .apptelephone input { padding-inline: 5px 12px; border: 0; outline: 0; }
    .apptelephone input:focus-visible { outline: none; }
    .appactions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 17px; }
    .appprimary, .appsecondary { min-height: 45px; border-radius: 9px; }
    .appprimary { background: var(--accent); color: #fff; }
    .appsecondary { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
    .applink { background: transparent; color: var(--accent); padding: 4px; text-decoration: underline; }
    .app-message { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
    .app-message-header { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); background: var(--tint); padding: 11px 14px; }
    .app-message-header span { color: var(--accent); font-size: .87rem; font-weight: 650; }
    .app-message dl { margin: 0; padding-inline: 14px; }
    .app-message dl div { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.12fr); gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
    .app-message dl div:last-child { border: 0; }
    .app-message dt { color: var(--muted); }
    .app-message dd { margin: 0; font-weight: 650; color: var(--ink); overflow-wrap: anywhere; }
    .app-message img { display: block; margin: 8px 14px 14px; width: min(260px,calc(100% - 28px)); max-height: 180px; object-fit: cover; border-radius: 8px; }
    @media (max-width: 740px) {
      .appwrap { width: calc(100% - 28px); }
      .appbar { min-height: 54px; }
      .appmain { padding-block: 12px calc(77px + env(safe-area-inset-bottom)); }
      .appnav { position: fixed; z-index: 5; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); background: var(--surface); box-shadow: 0 4px 23px #1b362926; }
      .appnav button { flex: 1; padding-inline: 6px; min-height: 41px; }
      .apphero { min-height: 0; grid-template-columns: 1fr; border-radius: 15px; }
      .apphero img { width: 100%; opacity: .29; }
      .apphero::before { background: linear-gradient(90deg,var(--hero),transparent); }
      .herocopy { padding: 20px; }
      .apphero h1 { font-size: clamp(2rem,8vw,3.3rem); }
      .apphero p { margin-top: 10px; font-size: .9rem; }
      .appgrid { grid-template-columns: 1fr; gap: 10px; }
      .apphero + .appgrid { margin-top: 10px; }
      .appchoices { gap: 7px; }
      .appchoice { gap: 6px; padding: 8px; min-height: 74px; }
    }
    @media (max-width: 380px) { .appfields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap"><strong id="brand">Демо заявок</strong><a id="all" href="./" hidden>Все демо</a></div></header>
  <main class="wrap">
    <section id="directory-page" hidden>
      <h1>Демо для выездных услуг</h1>
      <div class="directory" id="directory"></div>
    </section>
    <div class="layout" id="service" hidden>
      <section class="intro">
        <h1 id="title"></h1>
        <p id="description"></p>
      </section>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Данные для оценки</h2>
        <p>Демо-форма. Данные остаются на этой странице.</p>
        <form id="form">
          <div id="fields"></div>
          <div class="actions">
            <button class="primary" type="submit">Показать заявку мастеру</button>
            <button class="secondary" id="example" type="button">Подставить пример</button>
          </div>
          <p id="status" role="status"></p>
        </form>
      </section>
      <section class="preview" id="preview" aria-labelledby="preview-title">
        <h2 id="preview-title" tabindex="-1">Пример сообщения в Telegram</h2>
        <p>Так мастер увидит данные заявки.</p>
        <div class="message"><span id="message"></span><img id="photo-preview" alt="Фото из примера заявки" hidden></div>
      </section>
    </div>
    <noscript>Включите JavaScript, чтобы открыть демо.</noscript>
  </main>

  <template id="service-app">
    <div class="apptop">
      <header class="appbar appwrap">
        <strong class="appbrand"><span class="appmark" aria-hidden="true"></span><span id="app-brand"></span></strong>
        <nav class="appnav" aria-label="Шаги заявки">
          <button type="button" data-step="0" aria-current="step">Услуга</button>
          <button type="button" data-step="1" disabled>Детали</button>
          <button type="button" data-step="2" disabled>Заявка</button>
        </nav>
        <span class="appdemo">Демо</span>
      </header>
    </div>
    <main class="appwrap appmain">
      <section class="apphero" id="app-hero" aria-labelledby="app-title">
        <div class="herocopy"><h1 id="app-title"></h1><p id="app-lede"></p></div>
        <img id="app-photo" width="1280" height="853" fetchpriority="high" alt="">
      </section>
      <div class="appgrid">
        <section class="appcard" id="app-service" aria-labelledby="service-title">
          <h2 id="service-title" tabindex="-1">Выберите услугу</h2>
          <fieldset>
            <legend class="sr">Вид мебели</legend>
            <div class="appchoices" id="app-choices"></div>
          </fieldset>
          <div class="appactions">
            <button type="button" class="appprimary" id="app-next">Далее</button>
          </div>
        </section>
        <section class="appcard" id="app-details" aria-labelledby="details-title" hidden>
          <h2 id="details-title" tabindex="-1">Детали заявки</h2>
          <form id="app-form">
            <div class="appfields" id="app-fields"></div>
            <div class="appupload">
              <label for="app-file"><strong>Приложить фото</strong><small id="app-file-label">JPG, PNG или WebP · до 4 МБ · по желанию</small></label>
              <input id="app-file" class="sr" type="file" accept="image/jpeg,image/png,image/webp">
              <div class="appattachment" id="app-attachment" hidden><img id="app-thumb" alt="Прикреплённое фото"><button type="button" class="applink" id="app-file-remove">Удалить фото</button></div>
              <p class="apperror" id="app-file-error" role="status" hidden></p>
            </div>
            <label class="applabel" for="app-tel">Телефон для связи</label>
            <div class="apptelephone" id="app-telephone">
              <span aria-hidden="true">+7</span>
              <input id="app-tel" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="900 000-00-00" aria-describedby="app-phone-hint" required>
            </div>
            <p class="sr" id="app-phone-hint">Введите 10 цифр после +7.</p>
            <div class="appactions">
              <button type="submit" class="appprimary">Показать заявку</button>
              <button type="button" class="appsecondary" id="app-example">Подставить пример</button>
            </div>
          </form>
        </section>
        <section class="appcard" id="app-receipt" aria-labelledby="receipt-title" hidden>
          <h2 id="receipt-title" tabindex="-1">Как заявку увидит мастер</h2>
          <div class="app-message">
            <div class="app-message-header"><strong>Новая заявка</strong><span>Telegram</span></div>
            <dl id="app-message"></dl>
            <img id="app-receipt-photo" alt="Фото к заявке" hidden>
          </div>
          <div class="appactions">
            <button type="button" class="appsecondary" id="app-edit">Изменить заявку</button>
          </div>
        </section>
        <aside class="appsummary" aria-labelledby="app-summary-title">
          <h2 id="app-summary-title">Ваша заявка</h2>
          <p class="app-selection" id="app-selection" aria-live="polite"></p>
          <p id="app-price-note"></p>
          <p class="appprivacy">В демо данные остаются в браузере.</p>
        </aside>
      </div>
    </main>
  </template>
  <script>

  const priorityNiches = {"removal":{"name":"Вывоз вещей и мебели","title":"Старую мебель пора вывезти.","description":"Покажите, что нужно забрать, и укажите этаж и лифт. Исполнитель оценит объём и скажет, сколько будет стоить вывоз.","image":4246098,"alt":"Диван и коробки с вещами в комнате","position":"center 50%","palette":["#24603b","#e8f2e8","#183627"],"type":"Что вывезти","choices":[["Диван и кресла","Мягкая мебель и матрасы"],["Шкафы","Шкафы и стеллажи"],["Столы и стулья","Столы, стулья и комоды"],["Несколько вещей","Можно указать список"]],"note":"На стоимость влияют объём вещей, этаж и наличие лифта.","fields":[{"label":"Список вещей","example":"Диван и кресло","placeholder":"Например, диван и кресло","wide":true,"optional":true},{"label":"Адрес или район","example":"Советский район","placeholder":"Район или улица","wide":false},{"label":"Этаж","example":"5","placeholder":"Например, 5","wide":false},{"label":"Лифт","options":["Нет лифта","Пассажирский","Грузовой"],"example":"Нет лифта"}]},"upholstery":{"name":"Перетяжка мебели","title":"Обновите любимый диван.","description":"Приложите фото мебели, укажите размеры и расскажите, что хочется поменять. Мастер даст предварительную оценку.","image":4846097,"alt":"Мягкий диван с декоративными подушками","position":"center 55%","palette":["#943e2e","#f8eae5","#3b2626"],"type":"Тип мебели","choices":[["Угловой диван","Включая угловую секцию"],["Прямой диван","Сиденья, спинка, подлокотники"],["Кресло","Обивка кресла"],["Стулья и другое","Сиденья и спинки"]],"note":"Мастер оценивает работу по размерам, ткани и фотографии.","fields":[{"label":"Примерные размеры","example":"240 × 160 см","placeholder":"Можно написать «не знаю»","wide":false},{"label":"Что нужно заменить","example":"Обивку, каркас цел","placeholder":"Обивка, наполнитель или ремонт","wide":true},{"label":"Ткань или цвет","example":"Серо-зелёный велюр","placeholder":"Если уже выбрали","wide":false,"optional":true}]},"cleaning":{"name":"Химчистка мебели","title":"Диван снова будет чистым.","description":"Покажите диван и пятна на фото. Мастер уточнит цену чистки и предложит время выезда.","image":27176672,"alt":"Чистка обивки дивана пылесосом","position":"center 50%","palette":["#155b78","#e4f1f6","#17313f"],"type":"Тип мебели","choices":[["Прямой диван","Сиденья, спинка, подлокотники"],["Угловой диван","Включая угловую секцию"],["Кресло","Обивка кресла"],["Матрас","Размер и загрязнения"]],"note":"Мастер уточняет цену по размеру мебели, обивке и загрязнениям.","fields":[{"label":"Размер или число мест","example":"3 места","placeholder":"Например, 3 места","wide":false},{"label":"Что нужно почистить","example":"Пятно от кофе на сиденье","placeholder":"Расскажите о пятнах или запахе","wide":true},{"label":"Район","example":"Центральный","placeholder":"Район или улица","wide":false}]}};
  const activeNiche = new URLSearchParams(location.search).get('service');
  if (Object.hasOwn(priorityNiches, activeNiche)) {
    mountServiceApp(priorityNiches[activeNiche]);
  } else {
    const fields = {
      text: (label, example, placeholder = '', wide = false) => ({ label, example, placeholder, wide }),
      select: (label, options, example = options[0]) => ({ label, options, example }),
      photo: label => ({ label, type: 'file', wide: true, optional: true }),
      phone: { label: 'Телефон для связи', type: 'tel', example: '+7 900 000-00-00', placeholder: '+7 900 000-00-00' }
    };
    const { text, select, photo, phone } = fields;
    const presets = {
      removal: {
        name: 'Вывоз вещей и мебели', title: 'Рассчитайте вывоз по фото', colors: ['#214f3e', '#e4efe5'],
        description: 'Укажите, что нужно вывезти. По фото, этажу и наличию лифта исполнитель сможет оценить стоимость.',
        fields: [text('Что вывезти', 'Диван и кресло', 'Например, диван и кресло', true),
          text('Адрес или район', 'Советский район', 'Район или улица'), text('Этаж', '5', 'Например, 5'),
          select('Лифт', ['Нет лифта', 'Пассажирский', 'Грузовой']), phone, photo('Фото вещей')]
      },
      upholstery: {
        name: 'Перетяжка мебели', title: 'Узнайте цену перетяжки', colors: ['#723d34', '#f3e8e3'],
        description: 'Опишите мебель и приложите фото. Мастер оценит работу и подскажет, какие детали нужно уточнить.',
        fields: [select('Тип мебели', ['Угловой диван', 'Прямой диван', 'Кресло', 'Стулья', 'Другое']),
          text('Примерные размеры', '240 × 160 см', 'Можно написать «не знаю»'),
          text('Что нужно заменить', 'Обивку, каркас цел', 'Обивка, наполнитель или ремонт', true),
          { ...text('Ткань или цвет', 'Серо-зелёный велюр', 'Если уже выбрали'), optional: true }, phone, photo('Фото мебели')]
      },
      moving: {
        name: 'Переезды и грузчики', title: 'Получите оценку переезда', colors: ['#304d7b', '#e5ecf7'],
        description: 'Укажите маршрут, крупные вещи и условия погрузки. Исполнитель сможет предложить машину и оценить работу.',
        fields: [text('Откуда', 'Центральный район', 'Район отправления'),
          text('Куда', 'Заречье', 'Район назначения'),
          text('Этаж и лифт при погрузке', '4-й, без лифта', 'Например, 4-й, без лифта'),
          text('Этаж и лифт при выгрузке', '7-й, грузовой лифт', 'Например, 7-й, грузовой лифт'),
          text('Крупные вещи', 'Холодильник и 8 коробок', 'Мебель, техника, коробки', true),
          text('Когда нужен переезд', 'В субботу после 12:00', 'День и время'), phone]
      },
      screens: {
        name: 'Москитные сетки', title: 'Рассчитайте москитные сетки', colors: ['#3d5840', '#e9eee0'],
        description: 'Укажите тип проёма, количество и размеры. Если размеров нет, мастер подскажет, как организовать замер.',
        fields: [select('Тип проёма', ['Окно', 'Балконная дверь', 'Другой проём']),
          text('Количество', '2', 'Например, 2'),
          text('Примерные размеры', '60 × 130 см', 'Можно написать «нужен замер»'),
          phone, photo('Фото проёма или крепления')]
      },
      cleaning: {
        name: 'Химчистка мебели', title: 'Узнайте цену химчистки по фото', colors: ['#325369', '#e1eef1'],
        description: 'Опишите мебель и загрязнение. По фото мастер сможет уточнить стоимость чистки и согласовать выезд.',
        fields: [select('Тип мебели', ['Прямой диван', 'Угловой диван', 'Кресло', 'Матрас', 'Другое']),
          text('Размер или число мест', '3 места', 'Например, 3 места'),
          text('Что нужно почистить', 'Пятно от кофе на сиденье', 'Расскажите о пятнах или запахе', true),
          text('Район', 'Центральный', 'Район или улица'), phone, photo('Фото мебели и загрязнения')]
      }
    };

    const byId = id => document.getElementById(id);
    const selected = new URLSearchParams(location.search).get('service');
    if (Object.hasOwn(presets, selected)) {
      showService(presets[selected]);
    } else {
      byId('directory-page').hidden = false;
      for (const [id, preset] of Object.entries(presets)) {
        const link = document.createElement('a');
        link.className = 'card';
        link.href = '?service=' + id;
        link.textContent = preset.name;
        byId('directory').append(link);
      }
    }

    function showService(preset) {
      document.title = preset.name + ' — демо заявки';
      document.documentElement.style.setProperty('--ink', preset.colors[0]);
      document.documentElement.style.setProperty('--wash', preset.colors[1]);
      byId('brand').textContent = preset.name;
      byId('title').textContent = preset.title;
      byId('description').textContent = preset.description;
      byId('all').hidden = false;
      byId('service').hidden = false;

      const controls = preset.fields.map(field => {
        const label = document.createElement('label');
        label.classList.toggle('wide', Boolean(field.wide));
        const caption = document.createElement('span');
        caption.textContent = field.label + (field.optional ? ' (необязательно)' : '');
        const control = document.createElement(field.options ? 'select' : 'input');
        if (field.options) {
          control.add(new Option('Выберите вариант', ''));
          for (const option of field.options) control.add(new Option(option, option));
        } else {
          control.type = field.type || 'text';
          control.placeholder = field.placeholder || '';
          if (field.type === 'file') control.accept = 'image/*';
          else control.maxLength = 200;
          if (field.type === 'tel') {
            control.inputMode = 'tel';
            control.autocomplete = 'off';
          }
        }
        control.required = !field.optional;
        label.append(caption, control);
        byId('fields').append(label);
        return { field, control };
      });

      const photoPreview = byId('photo-preview');
      let photoUrl;
      function renderMessage(useExample) {
        const lines = ['Новая заявка · ' + preset.name, ''];
        let attachedPhoto;
        for (const { field, control } of controls) {
          if (field.type === 'file') {
            const file = control.files?.[0];
            if (!useExample && file?.type.startsWith('image/')) attachedPhoto = file;
          } else {
            const value = useExample ? field.example : control.value.trim();
            if (value) lines.push(field.label + ': ' + value);
          }
        }
        if (attachedPhoto) lines.push('Фото: ' + attachedPhoto.name);
        byId('message').textContent = lines.join('\n');
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = attachedPhoto ? URL.createObjectURL(attachedPhoto) : undefined;
        if (photoUrl) photoPreview.src = photoUrl;
        else photoPreview.removeAttribute('src');
        photoPreview.hidden = !photoUrl;
      }
      renderMessage(true);

      byId('example').addEventListener('click', () => {
        for (const { field, control } of controls) {
          control.value = field.example || '';
        }
        renderMessage(true);
        byId('status').textContent = 'Пример подставлен. Поля можно изменить.';
      });
      byId('form').addEventListener('submit', event => {
        event.preventDefault();
        for (const { field, control } of controls) {
          if (!field.optional && !control.value.trim()) {
            control.value = '';
            control.reportValidity();
            return;
          }
        }
        renderMessage(false);
        byId('status').textContent = 'Пример заявки обновлён.';
        byId('preview-title').focus();
      });
    }
  }

  function mountServiceApp(preset) {
    document.body.replaceChildren(document.getElementById('service-app').content.cloneNode(true));
    document.body.classList.add('service-app');
    document.title = preset.name + ' — демо заявки';
    const style = document.body.style;
    const [accent, tint, hero] = preset.palette;
    for (const [name, value] of Object.entries({accent, tint, hero, 'photo-position': preset.position})) {
      style.setProperty('--' + name, value);
    }

    const get = id => document.getElementById(id);
    function element(tag, text) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    }
    get('app-brand').textContent = preset.name;
    get('app-title').textContent = preset.title;
    get('app-lede').textContent = preset.description;
    get('app-price-note').textContent = preset.note;
    const heroImage = get('app-photo');
    heroImage.src = 'https://images.pexels.com/photos/' + preset.image + '/pexels-photo-' + preset.image + '.jpeg?auto=compress&cs=tinysrgb&w=1280';
    heroImage.alt = preset.alt;

    const tabs = Array.from(document.querySelectorAll('.appnav button'));
    const screens = ['app-service', 'app-details', 'app-receipt'].map(get);
    const headings = ['service-title', 'details-title', 'receipt-title'].map(get);
    let step = 0;
    let detailsOpened = false;
    let receiptReady = false;
    let service = 0;
    let photoUrl;

    function updateTabs() {
      tabs[1].disabled = !detailsOpened;
      tabs[2].disabled = !receiptReady;
      for (const [index, button] of tabs.entries()) {
        if (index === step) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      }
    }

    function showStep(index) {
      step = index;
      updateTabs();
      for (const [number, screen] of screens.entries()) screen.hidden = number !== index;
      get('app-hero').hidden = index !== 0;
      headings[index].focus({preventScroll: true});
      window.scrollTo(0, 0);
    }

    for (const [index, button] of tabs.entries()) button.addEventListener('click', () => showStep(index));
    get('app-next').addEventListener('click', () => {
      detailsOpened = true;
      showStep(1);
    });
    get('app-edit').addEventListener('click', () => showStep(1));

    function invalidateReceipt() {
      receiptReady = false;
      updateTabs();
    }

    function selectService(index) {
      service = index;
      get('app-selection').textContent = preset.choices[index][0];
      invalidateReceipt();
    }

    for (const [index, [title, note]] of preset.choices.entries()) {
      const label = element('label');
      label.className = 'appchoice';
      const radio = element('input');
      radio.type = 'radio';
      radio.name = 'service';
      radio.checked = index === 0;
      radio.addEventListener('change', () => selectService(index));
      const copy = element('span');
      copy.append(element('strong', title), element('small', note));
      label.append(radio, copy);
      get('app-choices').append(label);
    }
    selectService(0);

    const controls = preset.fields.map(field => {
      const label = element('label', field.label + (field.optional ? ' (по желанию)' : ''));
      label.className = field.wide ? 'applabel wide' : 'applabel';
      const input = element(field.options ? 'select' : 'input');
      if (field.options) {
        input.add(new Option('Выберите вариант', ''));
        for (const option of field.options) input.add(new Option(option, option));
      } else {
        input.type = 'text';
        input.placeholder = field.placeholder;
        input.maxLength = 150;
      }
      label.append(input);
      get('app-fields').append(label);
      return input;
    });

    const phone = get('app-tel');
    function formatPhone() {
      const raw = phone.value;
      const digits = raw.replace(/\D/g, '');
      const prefix = raw.trimStart().startsWith('+7') || (digits.length === 11 && /^[78]/.test(digits));
      const number = digits.slice(Number(prefix), Number(prefix) + 10);
      const position = Math.max(0, Math.min(number.length, raw.slice(0, phone.selectionStart ?? raw.length).replace(/\D/g, '').length - Number(prefix)));
      const chunks = [number.slice(0, 3), number.slice(3, 6), number.slice(6, 8), number.slice(8)];
      const formatted = chunks[0] + (chunks[1] ? ' ' + chunks[1] : '') + chunks.slice(2).filter(Boolean).map(chunk => '-' + chunk).join('');
      if (formatted !== raw) {
        phone.value = formatted;
        let caret = 0;
        let count = 0;
        while (caret < formatted.length && count < position) {
          if (/\d/.test(formatted[caret])) count++;
          caret++;
        }
        phone.setSelectionRange(caret, caret);
      }
      phone.setCustomValidity('');
      get('app-telephone').classList.toggle('has-number', Boolean(number.length));
      return number;
    }
    phone.addEventListener('input', formatPhone);

    const form = get('app-form');
    form.addEventListener('input', invalidateReceipt);
    form.addEventListener('change', invalidateReceipt);
    get('app-example').addEventListener('click', () => {
      for (const [index, field] of preset.fields.entries()) controls[index].value = field.example;
      phone.value = '9000000000';
      formatPhone();
      invalidateReceipt();
    });

    const fileInput = get('app-file');
    const error = get('app-file-error');
    const receiptPhoto = get('app-receipt-photo');
    function clearPhoto() {
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = undefined;
      get('app-thumb').removeAttribute('src');
      receiptPhoto.removeAttribute('src');
      receiptPhoto.hidden = true;
      get('app-attachment').hidden = true;
      get('app-file-label').textContent = 'JPG, PNG или WebP · до 4 МБ · по желанию';
      error.hidden = true;
    }

    fileInput.addEventListener('change', () => {
      clearPhoto();
      const file = fileInput.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 4 * 1024 * 1024) {
        fileInput.value = '';
        error.textContent = 'Выберите JPG, PNG или WebP размером до 4 МБ.';
        error.hidden = false;
        return;
      }
      photoUrl = URL.createObjectURL(file);
      get('app-thumb').src = photoUrl;
      get('app-file-label').textContent = file.name;
      get('app-attachment').hidden = false;
    });
    get('app-file-remove').addEventListener('click', () => {
      fileInput.value = '';
      clearPhoto();
      invalidateReceipt();
      fileInput.focus();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const number = formatPhone();
      if (number.length !== 10) {
        phone.setCustomValidity('Введите 10 цифр после +7.');
        phone.reportValidity();
        return;
      }
      const pairs = [[preset.type, preset.choices[service][0]]];
      for (const [index, control] of controls.entries()) {
        const value = control.value.trim();
        if (value) pairs.push([preset.fields[index].label, value]);
      }
      pairs.push(['Телефон', '+7 ' + phone.value]);
      const message = get('app-message');
      message.replaceChildren();
      for (const [label, value] of pairs) {
        const row = element('div');
        row.append(element('dt', label), element('dd', value));
        message.append(row);
      }
      if (photoUrl) receiptPhoto.src = photoUrl;
      receiptPhoto.hidden = !photoUrl;
      receiptReady = true;
      showStep(2);
    });
  }
  </script>
</body>
</html>
